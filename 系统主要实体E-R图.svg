  <rect x="1440" y="205" width="235" height="88" rx="3" fill="#fff4e6" stroke="#d7832a" stroke-width="2.8"/><text x="1557" y="249" class="entity">管理员</text>
  <ellipse cx="1450" cy="90" rx="115" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1450" y="90" class="attr">管理员编号（PK）</text><ellipse cx="1710" cy="115" rx="70" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1710" y="115" class="attr">用户名</text><ellipse cx="1720" cy="295" rx="64" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1720" y="295" class="attr">角色</text><path d="M1485 205 L1460 127 M1625 205 L1680 145 M1675 270 L1680 280" class="line"/>
  <!-- 关系 -->
  <polygon points="680,220 750,280 680,340 610,280" fill="#eff8f2" stroke="#4c8a68" stroke-width="2.7"/><text x="680" y="280" class="relation">包含</text><path d="M480 450 L610 305 M825 200 L750 270" class="line"/><text x="535" y="370" class="card">1</text><text x="785" y="245" class="card">N</text>
  <polygon points="725,530 795,590 725,650 655,590" fill="#eff8f2" stroke="#4c8a68" stroke-width="2.7"/><text x="725" y="590" class="relation">对应</text><path d="M480 530 L655 580 M985 600 L795 590" class="line"/><text x="555" y="552" class="card">1</text><text x="900" y="578" class="card">N</text>
  <polygon points="1360,340 1430,400 1360,460 1290,400" fill="#eff8f2" stroke="#4c8a68" stroke-width="2.7"/><text x="1360" y="400" class="relation">管理</text><path d="M1485 293 L1415 355 M1290 400 L1190 560" class="dash"/><text x="1440" y="330" class="card">1</text><text x="1250" y="490" class="card">N</text>
  <text x="900" y="1050" class="note">说明：顾客信息作为订单属性保存；财务报表由已支付订单聚合计算生成，不设置独立实体。</text>
</svg>
