<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs><style>
    .title{font:700 34px 'Microsoft YaHei','SimSun',sans-serif;fill:#1f2d3d}.entity{font:700 25px 'Microsoft YaHei','SimSun',sans-serif;fill:#263849;text-anchor:middle;dominant-baseline:middle}.attr{font:21px 'Microsoft YaHei','SimSun',sans-serif;fill:#34495e;text-anchor:middle;dominant-baseline:middle}.relation{font:700 21px 'Microsoft YaHei','SimSun',sans-serif;fill:#315e47;text-anchor:middle;dominant-baseline:middle}.card{font:700 21px 'Microsoft YaHei','SimSun',sans-serif;fill:#394858;text-anchor:middle}.note{font:19px 'Microsoft YaHei','SimSun',sans-serif;fill:#526170;text-anchor:middle}.line{stroke:#5f6e7c;stroke-width:2.3;fill:none}.dash{stroke:#5f6e7c;stroke-width:2.3;stroke-dasharray:9 7;fill:none}
  </style></defs>
  <rect width="1800" height="1120" fill="#fff"/><text x="900" y="56" class="title" text-anchor="middle">栖居民宿预订与管理系统主要实体 E-R 图</text>
  <!-- 房源 -->
  <rect x="245" y="470" width="235" height="88" rx="3" fill="#fff4e6" stroke="#d7832a" stroke-width="2.8"/><text x="362" y="514" class="entity">房源</text>
  <ellipse cx="105" cy="325" rx="105" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="105" y="325" class="attr">房源编号（PK）</text><ellipse cx="115" cy="470" rx="82" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="115" y="470" class="attr">房源名称</text><ellipse cx="115" cy="620" rx="68" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="115" y="620" class="attr">位置</text><ellipse cx="300" cy="695" rx="66" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="300" y="695" class="attr">价格</text><ellipse cx="510" cy="675" rx="108" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="510" y="675" class="attr">最大入住人数</text><ellipse cx="595" cy="500" rx="90" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="595" y="500" class="attr">房源状态</text><ellipse cx="520" cy="360" rx="84" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="520" y="360" class="attr">配套设施</text>
  <path d="M285 470 L160 355 M245 490 L195 480 M245 530 L180 600 M325 558 L310 655 M405 558 L480 645 M480 515 L505 505 M420 470 L485 393" class="line"/>
  <!-- 图片 -->
  <rect x="825" y="150" width="245" height="88" rx="3" fill="#fff4e6" stroke="#d7832a" stroke-width="2.8"/><text x="947" y="194" class="entity">房源图片</text>
  <ellipse cx="760" cy="70" rx="105" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="760" y="70" class="attr">图片编号（PK）</text><ellipse cx="1080" cy="70" rx="80" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1080" y="70" class="attr">图片路径</text><ellipse cx="1165" cy="205" rx="86" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1165" y="205" class="attr">图片排序</text><path d="M865 150 L795 100 M1030 150 L1060 105 M1070 205 L1080 205" class="line"/>
  <!-- 订单 -->
  <rect x="985" y="560" width="245" height="88" rx="3" fill="#fff4e6" stroke="#d7832a" stroke-width="2.8"/><text x="1107" y="604" class="entity">订单</text>
  <ellipse cx="900" cy="460" rx="105" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="900" y="460" class="attr">订单编号（PK）</text><ellipse cx="820" cy="595" rx="110" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="820" y="595" class="attr">顾客姓名、电话</text><ellipse cx="895" cy="750" rx="115" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="895" y="750" class="attr">入住、离店日期</text><ellipse cx="1105" cy="805" rx="92" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1105" y="805" class="attr">订单总金额</text><ellipse cx="1315" cy="760" rx="82" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1315" y="760" class="attr">订单状态</text><ellipse cx="1400" cy="605" rx="82" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1400" y="605" class="attr">支付状态</text><ellipse cx="1295" cy="455" rx="82" ry="39" fill="#edf5fc" stroke="#5780a5" stroke-width="2"/><text x="1295" y="455" class="attr">支付时间</text>
  <path d="M1020 560 L935 495 M985 602 L930 595 M1040 648 L930 725 M1100 648 L1105 766 M1180 648 L1260 730 M1230 600 L1320 605 M1180 560 L1260 485" class="line"/>
